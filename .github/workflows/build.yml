name: Build Phantom Client JAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: phantom-client-1.6.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
